<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>탕탕특공대 - Survivor.io Clone</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Black+Han+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <div id="ui-layer">
            <div id="top-bar">
                <div id="exp-bar-container">
                    <div id="exp-bar-fill"></div>
                </div>
                <div id="stats">
                    <div class="stat-item"><span id="timer">00:00</span></div>
                    <div class="stat-item">KILLS: <span id="kill-count">0</span></div>
                    <div class="stat-item">LV: <span id="level">1</span></div>
                </div>
            </div>

            <div id="skill-selection" class="hidden">
                <div class="skill-modal">
                    <h2>스킬 업그레이드</h2>
                    <p>하나의 스킬을 선택하세요</p>
                    <div id="skill-options">
                        <!-- Skills will be injected here -->
                    </div>
                </div>
            </div>

            <div id="game-over" class="hidden">
                <div class="game-over-modal">
                    <h1>전투 종료</h1>
                    <div class="final-stats">
                        <p>생존 시간: <span id="final-time">00:00</span></p>
                        <p>처치한 적: <span id="final-kills">0</span></p>
                        <p>최종 레벨: <span id="final-level">1</span></p>
                    </div>
                    <button id="restart-btn">다시 시작</button>
                </div>
            </div>

            <div id="start-screen">
                <div class="start-modal">
                    <h1>탕탕특공대</h1>
                    <p>도심에 나타난 괴물들을 물리치고 생존하세요!</p>
                    <div class="controls-guide">
                        <p>이동: WASD 또는 방향키 (모바일은 드래그)</p>
                        <p>공격: 자동 공격</p>
                    </div>
                    <button id="start-btn">전투 시작</button>
                </div>
            </div>

            <!-- Virtual Joystick Container -->
            <div id="joystick-container">
                <div id="joystick-base">
                    <div id="joystick-stick"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
